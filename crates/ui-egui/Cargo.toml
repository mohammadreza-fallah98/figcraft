[package]
name = "figiran-ui-egui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigIran egui frontend (the Figma-style UI: canvas, toolbar, layers, design and prototype panels, menus); swappable: nothing below depends on it"

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
figiran-geom = { workspace = true }
figiran-color = { workspace = true }
figiran-doc = { workspace = true }
figiran-text = { workspace = true }
figiran-layout = { workspace = true }
figiran-render = { workspace = true }
figiran-pathops = { workspace = true }
figiran-engine = { workspace = true }
figiran-format = { workspace = true }
figiran-portal = { workspace = true }
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
base64 = { workspace = true }
image = { workspace = true }
egui_extras = { workspace = true }
web-time = "1.1.0"

[build-dependencies]
serde_json = { workspace = true }
toml = "1"

[dev-dependencies]
wat = { workspace = true }
# Keep the test font features explicit; production uses the same bundled fallback faces.
# Dependency dev-features do not propagate into app release builds.
egui = { workspace = true, features = ["default_fonts", "monochrome_emoji_fonts"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-update = { workspace = true }
