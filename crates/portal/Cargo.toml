[package]
name = "figiran-portal"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Login against a company portal: browser sign-in with a one-time code (PKCE-style), the `figiran://auth` callback, tokens kept in the OS credential store, the user's project list and the join link of a project"

[lints]
workspace = true

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = "0.4"
# Blocking HTTPS client (rustls + ring, webpki roots: the same TLS stack the live sessions use). Already in
# Cargo.lock through craft-update.
ureq = { workspace = true }

# The browser build talks to the portal with fetch (and an XMLHttpRequest for uploads) and hears its login page through
# `postMessage`: see `web.rs`. Same versions the web app uses.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Crypto", "Request", "RequestInit", "RequestMode", "RequestCredentials", "Response", "Headers", "AbortSignal", "MessageEvent", "EventTarget", "Event", "ProgressEvent", "XmlHttpRequest", "XmlHttpRequestEventTarget", "XmlHttpRequestUpload"] }

# The OS credential store holds the refresh token: Windows Credential Manager and the macOS Keychain.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
keyring = { workspace = true }
