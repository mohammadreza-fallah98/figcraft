[package]
name = "figiran-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "FigIran engine: sessions, undo history, the command registry every surface (UI, CLI, control channel, MCP) dispatches through, pointer tools, components and the Figma menu catalog"

[lints]
workspace = true

[dependencies]
figiran-geom = { workspace = true }
figiran-color = { workspace = true }
figiran-doc = { workspace = true }
figiran-collab = { workspace = true }
figiran-layout = { workspace = true }
figiran-text = { workspace = true }
figiran-pathops = { workspace = true }
figiran-render = { workspace = true }
figiran-format = { workspace = true }
figiran-svg = { workspace = true }
figiran-pdf = { workspace = true }
figiran-vectordrawable = { workspace = true }
craft-docpath = { workspace = true }
figiran-plugin = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
deunicode = { workspace = true }
same-file = { workspace = true }
web-time = "1.1.0"

# Downloading a missing font (desktop only; the web keeps its built-in fonts). The bundled index
# (~620 KB) lets the Missing fonts window tell which fonts can be downloaded without a request.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-font-store = { workspace = true, features = ["bundled-index"] }
craft-font-catalog = { workspace = true }

[dev-dependencies]
zip = { workspace = true }
wat = { workspace = true }
image = { workspace = true }
