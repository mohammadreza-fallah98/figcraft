[package]
name = "figiran-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "FigIran command line: info, export, convert, render, scripted commands, MCP server, perf"

[[bin]]
name = "figiran-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
figiran-engine = { workspace = true }
figiran-doc = { workspace = true }
figiran-render = { workspace = true }
figiran-text = { workspace = true }
figiran-svg = { workspace = true }
figiran-format = { workspace = true }
figiran-mcp = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
# 4.6 breaks Bash subcommand completion for hyphenated binary names (clap-rs/clap#6421).
clap_complete = "~4.5.67"
clap_mangen = "0.3"
